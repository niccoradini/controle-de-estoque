name: Testar e publicar no Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-estoque-production
  cancel-in-progress: false

jobs:
  test:
    name: Validar sistema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir o código
        run: npm run check

      - name: Executar testes
        run: npm test

  deploy:
    name: Publicar produção
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Baixar o código aprovado
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir credenciais protegidas
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos segredos do ambiente production."
            exit 1
          fi

      - name: Validar pacote do Worker
        run: npx wrangler deploy --dry-run --keep-vars

      - name: Aplicar migrações pendentes do D1
        run: npx wrangler d1 migrations apply controle-estoque-db --remote

      - name: Publicar Worker e arquivos do site
        shell: bash
        run: npx wrangler deploy --keep-vars --message "GitHub ${GITHUB_SHA::7}"

      - name: Conferir site publicado
        run: >-
          curl --fail --show-error --silent
          --retry 5 --retry-all-errors --retry-delay 5
          --max-time 30
          https://controleestoque.app.br/
          > /dev/null
